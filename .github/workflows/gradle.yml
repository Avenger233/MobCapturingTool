name: Java CI with Gradle

on:
  workflow_dispatch:
  push:
    branches: [ "1.20.x" ]
  pull_request:
    branches: [ "1.20.x" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: List generated JARs
        run: find . -type f -name "*.jar"

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MobCapturingTool
          path: |
            **/build/libs/*.jar
